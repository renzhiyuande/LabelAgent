openapi: 3.0.3
info:
  title: LabelHub PyAgent AI Review API
  version: 1.0.0
  description: Java backend to Python Agent contract for structured AI review.
paths:
  /v1/ai-review:
    post:
      summary: Execute AI review for a submission version
      operationId: executeAiReview
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReviewRequest'
      responses:
        '200':
          description: Structured AI review result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewResult'
        '400':
          description: Validation error
        '500':
          description: Agent execution error
components:
  schemas:
    AiReviewDimensionSpec:
      type: object
      required: [dimensionKey, dimensionName]
      properties:
        dimensionKey:
          type: string
        dimensionName:
          type: string
        weight:
          type: number
        scoreMin:
          type: number
        scoreMax:
          type: number
        passThreshold:
          type: number
        rejectThreshold:
          type: number
        promptInstruction:
          type: string
    AiReviewRequest:
      type: object
      required: [submissionId, submissionVersionId, taskId, submitData]
      properties:
        submissionId:
          type: integer
          format: int64
        submissionVersionId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        platformKey:
          type: string
        modelId:
          type: string
        promptTemplate:
          type: string
        outputSchemaJson:
          type: string
        submitData:
          type: object
          additionalProperties: true
        itemPayload:
          type: object
          additionalProperties: true
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/AiReviewDimensionSpec'
        memoryContext:
          type: array
          description: Optional retrieved memory cases injected by Backend (Phase 2+).
          items:
            type: object
            additionalProperties: true
        llmBaseUrl:
          type: string
          description: Optional per-request LLM base URL resolved by Backend from provider catalog.
        llmApiKey:
          type: string
          description: Optional per-request LLM API key resolved by Backend (never stored by Agent).
    AiReviewDimensionResult:
      type: object
      required: [dimensionKey, dimensionName, score]
      properties:
        dimensionKey:
          type: string
        dimensionName:
          type: string
        score:
          type: number
        weight:
          type: number
        verdict:
          type: string
          enum: [PASS, REJECT, REQUIRE_HUMAN]
        comment:
          type: string
    AiReviewResult:
      type: object
      required: [platformKey, modelId, verdict, totalScore, summary, dimensions]
      properties:
        platformKey:
          type: string
        modelId:
          type: string
        verdict:
          type: string
          enum: [PASS, REJECT, REQUIRE_HUMAN]
        totalScore:
          type: number
        summary:
          type: string
        promptSnapshot:
          type: string
        inputSnapshot:
          type: object
          additionalProperties: true
        parsedResult:
          type: object
          additionalProperties: true
        rawResponseText:
          type: string
        providerRequestId:
          type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/AiReviewDimensionResult'
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
