name: Agent Quality Review

on:
  push:
    branches:
      - review/agent-quality-loop
      - feat/review-agent-orchestration
      - feat/agent-async-runtime
  pull_request:
    paths:
      - "agent/**"
      - "backend/**"
      - ".github/workflows/agent-quality-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r agent/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q agent/app agent/scripts

      - name: Run Agent test suite
        env:
          LABELHUB_INTERNAL_TOKEN: test-internal-token
          LABELHUB_AGENT_OPENAI_API_KEY: test-openai-api-key
        working-directory: agent
        run: pytest -q -m "not live"

  backend-async-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and test async runtime
        working-directory: backend
        run: >-
          mvn -B -pl host-app -am
          -Dtest=AsyncTaskWorkerTest,AiReviewTaskHandlerAsyncTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
